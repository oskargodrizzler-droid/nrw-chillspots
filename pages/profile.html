<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Profil · NRW Chillspots</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

</head>

<body>


<main
  class="panel"
  style="max-width:600px;"
>


  <div class="section-title">

    <h1>
      👤 Mein Profil
    </h1>

    <button
      class="secondary"
      onclick="window.location.href='../index.html'"
    >
      ✕
    </button>

  </div>


  <section class="admin-section">


    <p id="profileEmail">
      ⏳
    </p>


    <label>
      Nickname
    </label>


    <input
      id="nickname"
      type="text"
      maxlength="30"
      minlength="2"
      placeholder="Dein Nickname"
      style="
        width:100%;
        padding:12px;
        margin-top:8px;
        border-radius:10px;
        border:1px solid #ddd;
      "
    >


    <p class="hint">

      Dieser Name wird bei deinen
      Spots angezeigt.

    </p>


    <button
      class="primary full-button"
      onclick="saveProfile()"
    >
      💾 Speichern
    </button>


    <button
      class="secondary full-button"
      onclick="window.location.href='../index.html'"
    >
      ← Zurück
    </button>


  </section>


</main>


<div
  id="status"
  class="status"
></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/profiles.js"></script>


<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {

    loadProfilePage();

  }
);

</script>

</body>

</html>
