<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin · NRW Chillspots</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

</head>

<body>


<div
  id="adminLoading"
  class="admin-loading"
>
  🛡️ Admin-Bereich wird geprüft...
</div>


<main
  id="adminPanel"
  class="panel"
  style="
    max-width:1000px;
    display:none;
  "
>


  <div class="section-title">

    <h1>
      🛡️ Admin Dashboard
    </h1>

    <button
      class="secondary"
      onclick="window.location.href='../index.html'"
    >
      ← Zurück
    </button>

  </div>


  <section class="admin-section">

    <h2>
      📊 Übersicht
    </h2>

    <div
      id="stats"
      class="admin-stats"
    >

      ⏳

    </div>

  </section>


  <section class="admin-section">

    <h2>
      👥 Benutzer
    </h2>

    <div id="users">

      <div class="empty">
        ⏳ Benutzer werden geladen...
      </div>

    </div>

  </section>


  <section class="admin-section">

    <h2>
      📍 Spots
    </h2>

    <div id="adminSpots">

      <div class="empty">
        ⏳ Spots werden geladen...
      </div>

    </div>

  </section>


</main>


<div
  id="status"
  class="status"
></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/profiles.js"></script>
<script src="../js/spots.js"></script>
<script src="../js/likes.js"></script>
<script src="../js/map.js"></script>
<script src="../js/admin.js"></script>


<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {

    loadAdminPage();

  }
);

</script>

</body>

</html>
