<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NRW Chillspots 📍</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      padding: 18px;
      background: #111118;
      border-bottom: 1px solid #292933;
      position: relative;
      z-index: 1000;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      color: #999;
      font-size: 14px;
    }

    .controls {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #111118;
      position: relative;
      z-index: 1000;
    }

    #search {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1b1b23;
      color: white;
      font-size: 15px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 15px;
      background: #7c3aed;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    #locationButton {
      background: #2563eb;
      font-size: 18px;
    }

    #addButton {
      background: #16a34a;
    }

    #map {
      width: 100%;
      height: calc(100vh - 150px);
      min-height: 500px;
    }

    .leaflet-popup-content-wrapper {
      background: #18181f;
      color: white;
      border-radius: 14px;
    }

    .leaflet-popup-tip {
      background: #18181f;
    }

    .popup-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .popup-description {
      color: #bbb;
      margin-bottom: 10px;
    }

    .popup-category {
      display: inline-block;
      padding: 5px 8px;
      background: #29293a;
      border-radius: 8px;
      font-size: 12px;
    }

    .popup-like {
      margin-top: 10px;
      background: #ef4444;
      width: 100%;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 5000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 430px;
      background: #17171e;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 20px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .modal-box label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      color: #bbb;
    }

    .modal-box input,
    .modal-box textarea,
    .modal-box select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #22222a;
      color: white;
      font-size: 15px;
    }

    .modal-box textarea {
      min-height: 90px;
      resize: vertical;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .modal-buttons button {
      flex: 1;
    }

    #cancelButton {
      background: #33333d;
    }

    #status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #18181f;
      border: 1px solid #333;
      padding: 10px 16px;
      border-radius: 12px;
      z-index: 6000;
      display: none;
      font-size: 14px;
    }

    .location-marker {
      font-size: 25px;
    }
  </style>
</head>

<body>

<header>
  <h1>📍 NRW Chillspots</h1>
  <p>Finde gute Spots in ganz NRW</p>
</header>

<div class="controls">

  <input
    id="search"
    type="text"
    placeholder="🔎 Stadt oder Spot suchen..."
  >

  <button id="locationButton" title="Meinen Standort">
    📍
  </button>

  <button id="addButton">
    ＋
  </button>

</div>

<div id="map"></div>

<div id="status"></div>

<!-- ADD SPOT MODAL -->
<div class="modal" id="modal">

  <div class="modal-box">

    <h2>📍 Neuen Chillspot</h2>

    <p style="color:#aaa;font-size:14px;">
      Klicke zuerst auf der Karte auf den gewünschten Standort.
    </p>

    <label>Name</label>

    <input
      id="spotName"
      type="text"
      placeholder="z.B. Stadtpark"
    >

    <label>Beschreibung</label>

    <textarea
      id="spotDescription"
      placeholder="Warum ist der Spot nice?"
    ></textarea>

    <label>Kategorie</label>

    <select id="spotCategory">

      <option value="Park">🌳 Park</option>
      <option value="See">🌊 See</option>
      <option value="Sport">⚽ Sport</option>
      <option value="Aussicht">🌇 Aussicht</option>
      <option value="Skatepark">🛹 Skatepark</option>
      <option value="Sonstiges">📍 Sonstiges</option>

    </select>

    <div class="modal-buttons">

      <button id="cancelButton">
        Abbrechen
      </button>

      <button id="saveButton">
        Spot veröffentlichen
      </button>

    </div>

  </div>

</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* =========================================
     SUPABASE
  ========================================= */

  const SUPABASE_URL =
    "https://ayukjqhmmgqbgtiusvsx.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_oN4MVoqoeGLRPtEEgIpalQ_H_GZk1u0";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     MAP
  ========================================= */

  const map = L.map("map").setView(
    [51.4332, 7.6616],
    9
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }
  ).addTo(map);


  /* =========================================
     VARIABLES
  ========================================= */

  let selectedLocation = null;
  let selectedMarker = null;
  let userLocationMarker = null;

  const markers = [];


  /* =========================================
     STATUS
  ========================================= */

  function showStatus(message) {

    const status =
      document.getElementById("status");

    status.textContent = message;
    status.style.display = "block";

    setTimeout(() => {
      status.style.display = "none";
    }, 3000);
  }


  /* =========================================
     MAP CLICK
  ========================================= */

  map.on("click", function(e) {

    selectedLocation = {
      lat: e.latlng.lat,
      lng: e.latlng.lng
    };

    if (selectedMarker) {
      map.removeLayer(selectedMarker);
    }

    selectedMarker =
      L.marker([
        e.latlng.lat,
        e.latlng.lng
      ]).addTo(map);

    showStatus(
      "📍 Standort ausgewählt"
    );

  });


  /* =========================================
     LOAD SPOTS
  ========================================= */

  async function loadSpots() {

    const { data, error } =
      await supabaseClient
        .from("spots")
        .select("*");

    if (error) {

      console.error(error);

      showStatus(
        "❌ Spots konnten nicht geladen werden"
      );

      return;
    }

    console.log("Spots:", data);

    data.forEach(spot => {

      /*
        Wir akzeptieren verschiedene
        mögliche Spaltennamen.
      */

      const lat =
        spot.latitude ??
        spot.lat;

      const lng =
        spot.longitude ??
        spot.lng ??
        spot.lon;

      if (
        lat === null ||
        lat === undefined ||
        lng === null ||
        lng === undefined
      ) {
        return;
      }

      addSpotMarker(
        spot,
        lat,
        lng
      );

    });

  }


  /* =========================================
     ADD MARKER
  ========================================= */

  function addSpotMarker(
    spot,
    lat,
    lng
  ) {

    const marker =
      L.marker([lat, lng])
        .addTo(map);

    const name =
      spot.name || "Unbenannter Spot";

    const description =
      spot.description ||
      "Keine Beschreibung vorhanden";

    const category =
      spot.category ||
      "Sonstiges";

    const popup = `

      <div>

        <div class="popup-title">
          📍 ${escapeHtml(name)}
        </div>

        <div class="popup-description">
          ${escapeHtml(description)}
        </div>

        <span class="popup-category">
          ${escapeHtml(category)}
        </span>

        <button
          class="popup-like"
          onclick="likeSpot('${spot.id}')"
        >
          ❤️ Gefällt mir
        </button>

      </div>

    `;

    marker.bindPopup(popup);

    markers.push({
      marker: marker,
      spot: spot
    });

  }


  /* =========================================
     LIKE
  ========================================= */

  window.likeSpot = async function(spotId) {

    const { error } =
      await supabaseClient
        .from("likes")
        .insert({
          spot_id: spotId
        });

    if (error) {

      console.error(error);

      showStatus(
        "❌ Like konnte nicht gespeichert werden"
      );

      return;
    }

    showStatus(
      "❤️ Spot geliked!"
    );

  };


  /* =========================================
     ADD BUTTON
  ========================================= */

  document
    .getElementById("addButton")
    .addEventListener("click", () => {

      if (!selectedLocation) {

        showStatus(
          "📍 Klicke zuerst auf die Karte"
        );

        return;
      }

      document
        .getElementById("modal")
        .classList.add("active");

    });


  /* =========================================
     CANCEL
  ========================================= */

  document
    .getElementById("cancelButton")
    .addEventListener("click", () => {

      document
        .getElementById("modal")
        .classList.remove("active");

    });


  /* =========================================
     SAVE SPOT
  ========================================= */

  document
    .getElementById("saveButton")
    .addEventListener("click", async () => {

      if (!selectedLocation) {

        showStatus(
          "❌ Kein Standort ausgewählt"
        );

        return;
      }

      const name =
        document
          .getElementById("spotName")
          .value
          .trim();

      const description =
        document
          .getElementById("spotDescription")
          .value
          .trim();

      const category =
        document
          .getElementById("spotCategory")
          .value;


      if (!name) {

        showStatus(
          "❌ Gib einen Namen ein"
        );

        return;
      }


      /*
        Neuer Spot
      */

      const spotData = {

        name: name,

        description:
          description,

        category:
          category,

        latitude:
          selectedLocation.lat,

        longitude:
          selectedLocation.lng

      };


      const {
        data,
        error
      } = await supabaseClient
        .from("spots")
        .insert(spotData)
        .select()
        .single();


      if (error) {

        console.error(error);

        showStatus(
          "❌ Fehler beim Speichern"
        );

        return;
      }


      /*
        Marker sofort anzeigen
      */

      addSpotMarker(
        data,
        selectedLocation.lat,
        selectedLocation.lng
      );


      /*
        Formular zurücksetzen
      */

      document
        .getElementById("spotName")
        .value = "";

      document
        .getElementById("spotDescription")
        .value = "";


      document
        .getElementById("modal")
        .classList.remove("active");


      if (selectedMarker) {

        map.removeLayer(
          selectedMarker
        );

        selectedMarker = null;

      }


      selectedLocation = null;


      showStatus(
        "🎉 Chillspot veröffentlicht!"
      );

    });


  /* =========================================
     LIVE STANDORT
  ========================================= */

  document
    .getElementById("locationButton")
    .addEventListener("click", () => {

      if (!navigator.geolocation) {

        showStatus(
          "❌ Standort wird nicht unterstützt"
        );

        return;
      }

      showStatus(
        "📍 Standort wird gesucht..."
      );


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;


          if (userLocationMarker) {

            map.removeLayer(
              userLocationMarker
            );

          }


          userLocationMarker =
            L.marker(
              [lat, lng]
            ).addTo(map);


          userLocationMarker
            .bindPopup(
              "📍 Du bist hier"
            )
            .openPopup();


          map.setView(
            [lat, lng],
            15
          );


          showStatus(
            "📍 Dein Standort wurde gefunden"
          );

        },

        function(error) {

          console.error(error);

          showStatus(
            "❌ Standortzugriff wurde abgelehnt"
          );

        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

    });


  /* =========================================
     SEARCH
  ========================================= */

  document
    .getElementById("search")
    .addEventListener("input", function() {

      const search =
        this.value
          .toLowerCase()
          .trim();


      markers.forEach(item => {

        const spot =
          item.spot;

        const text = (

          (spot.name || "") +
          " " +
          (spot.description || "") +
          " " +
          (spot.category || "")

        ).toLowerCase();


        if (
          !search ||
          text.includes(search)
        ) {

          item.marker.addTo(map);

        } else {

          map.removeLayer(
            item.marker
          );

        }

      });

    });


  /* =========================================
     SECURITY
  ========================================= */

  function escapeHtml(text) {

    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =========================================
     START
  ========================================= */

  loadSpots();

</script>

</body>
</html>
