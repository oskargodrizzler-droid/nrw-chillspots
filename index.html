<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NRW Chillspots</title>

  <!-- LEAFLET -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    body {
      overflow: hidden;
    }

    /* HEADER */

    header {
      height: 85px;
      background: #111;
      border-bottom: 1px solid #292929;
      padding: 14px 18px;
      position: relative;
      z-index: 1000;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 5px 0 0;
      color: #999;
      font-size: 14px;
    }

    /* CONTROLS */

    .controls {
      position: absolute;
      top: 98px;
      left: 12px;
      right: 12px;
      z-index: 1000;

      display: flex;
      gap: 8px;
    }

    .controls input {
      flex: 1;
      min-width: 0;

      padding: 13px 15px;
      border-radius: 13px;

      border: 1px solid #333;
      background: rgba(20,20,20,.95);
      color: white;

      font-size: 15px;
      outline: none;
    }

    .controls input:focus {
      border-color: #777;
    }

    button {
      border: none;
      border-radius: 13px;
      padding: 0 16px;

      background: white;
      color: black;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }

    button:active {
      transform: scale(.96);
    }

    /* MAP */

    #map {
      width: 100%;
      height: calc(100vh - 85px);
      min-height: 400px;
      background: #222;
    }

    /* LOCATION BUTTON */

    .location-button {
      position: absolute;

      right: 15px;
      bottom: 25px;

      z-index: 1000;

      width: 55px;
      height: 55px;

      padding: 0;

      border-radius: 50%;

      background: white;
      color: black;

      font-size: 23px;

      box-shadow: 0 3px 15px rgba(0,0,0,.4);
    }

    /* STATUS */

    .status {
      position: absolute;

      left: 50%;
      bottom: 25px;

      transform: translateX(-50%);

      z-index: 2000;

      background: rgba(15,15,15,.95);

      border: 1px solid #333;

      padding: 11px 17px;

      border-radius: 12px;

      display: none;

      white-space: nowrap;
    }

    /* ADD HINT */

    .hint {
      position: absolute;

      top: 155px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 2000;

      background: rgba(10,10,10,.95);

      border: 1px solid #333;

      padding: 10px 15px;

      border-radius: 12px;

      display: none;

      font-size: 14px;
    }

    /* POPUP */

    .leaflet-popup-content-wrapper {
      background: #151515;
      color: white;
      border-radius: 13px;
    }

    .leaflet-popup-tip {
      background: #151515;
    }

    .leaflet-popup-content {
      margin: 14px;
      min-width: 180px;
    }

    .spot-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .spot-category {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .spot-description {
      font-size: 14px;
      line-height: 1.4;
    }

    .coords {
      color: #777;
      font-size: 11px;
      margin-top: 8px;
    }

    /* LEAFLET MOBILE FIX */

    .leaflet-control-zoom {
      margin-top: 150px !important;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 22px;
      }

      header p {
        font-size: 12px;
      }

      .controls {
        top: 98px;
      }

      .controls button {
        width: 48px;
        padding: 0;
      }

      .leaflet-control-zoom {
        margin-top: 155px !important;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>
    <h1>📍 NRW Chillspots</h1>
    <p>die besten Chillspots in ganz NRW</p>
  </header>


  <!-- SUCHLEISTE -->

  <div class="controls">

    <input
      id="search"
      type="text"
      placeholder="🔎 Stadt oder Spot suchen..."
    >

    <button
      id="locationButton"
      title="Meinen Standort"
    >
      📍
    </button>

    <button
      id="addButton"
      title="Chillspot hinzufügen"
    >
      ＋
    </button>

  </div>


  <!-- HINWEIS -->

  <div
    id="hint"
    class="hint"
  >
    📍 Klicke auf die Karte, um einen Chillspot zu setzen
  </div>


  <!-- KARTE -->

  <div id="map"></div>


  <!-- LIVE LOCATION -->

  <button
    id="liveLocationButton"
    class="location-button"
    title="Live-Standort"
  >
    🎯
  </button>


  <!-- STATUS -->

  <div
    id="status"
    class="status"
  ></div>


  <!-- LEAFLET JS -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
      "https://ayukjqhmmgqbgtiusvsx.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_oN4MVoqoeGLRPtEEgIpalQ_H_GZk1u0";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================
       KARTE ERSTELLEN
    ========================================= */

    const map = L.map("map").setView(
      [51.4332, 7.0116],
      9
    );


    /* OPENSTREETMAP */

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    /* =========================================
       VARIABLEN
    ========================================= */

    let addMode = false;

    let selectedLocation = null;

    let userMarker = null;

    let accuracyCircle = null;

    let spotMarkers = [];


    /* =========================================
       STATUS
    ========================================= */

    function showStatus(message) {

      const status =
        document.getElementById("status");

      status.textContent = message;

      status.style.display = "block";

      setTimeout(() => {

        status.style.display = "none";

      }, 3000);
    }


    /* =========================================
       HTML SICHER MACHEN
    ========================================= */

    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /* =========================================
       SPOTS LADEN
    ========================================= */

    async function loadSpots() {

      console.log("Lade Chillspots...");

      const {
        data,
        error
      } = await supabaseClient
        .from("spots")
        .select("*")
        .order("id", {
          ascending: false
        });


      if (error) {

        console.error(
          "Supabase Fehler:",
          error
        );

        showStatus(
          "⚠️ Spots konnten nicht geladen werden"
        );

        return;
      }


      console.log(
        "Spots geladen:",
        data
      );


      /* Alte Marker entfernen */

      spotMarkers.forEach(marker => {

        map.removeLayer(marker);

      });

      spotMarkers = [];


      /* Neue Marker */

      (data || []).forEach(spot => {

        if (
          spot.latitude === null ||
          spot.latitude === undefined ||
          spot.longitude === null ||
          spot.longitude === undefined
        ) {
          return;
        }


        const marker = L.marker([
          Number(spot.latitude),
          Number(spot.longitude)
        ]).addTo(map);


        const name =
          escapeHTML(
            spot.name || "Chillspot"
          );

        const category =
          escapeHTML(
            spot.category || "Chillspot"
          );

        const description =
          escapeHTML(
            spot.description || ""
          );


        marker.bindPopup(`
          <div class="spot-title">
            📍 ${name}
          </div>

          <div class="spot-category">
            ${category}
          </div>

          <div class="spot-description">
            ${description}
          </div>

          <div class="coords">
            ${Number(spot.latitude).toFixed(5)},
            ${Number(spot.longitude).toFixed(5)}
          </div>
        `);


        spotMarkers.push(marker);

      });

    }


    /* =========================================
       SPOT HINZUFÜGEN AKTIVIEREN
    ========================================= */

    function enableAddSpot() {

      addMode = true;

      selectedLocation = null;

      document.getElementById(
        "hint"
      ).style.display = "block";


      showStatus(
        "📍 Klicke jetzt auf einen Punkt auf der Karte"
      );

    }


    /* =========================================
       AUF KARTE KLICKEN
    ========================================= */

    map.on("click", async function(event) {

      if (!addMode) {
        return;
      }


      selectedLocation = event.latlng;

      addMode = false;


      document.getElementById(
        "hint"
      ).style.display = "none";


      /* Name */

      const name = prompt(
        "📍 Wie heißt der Chillspot?"
      );


      if (!name || name.trim() === "") {

        selectedLocation = null;

        return;
      }


      /* Beschreibung */

      const description =
        prompt(
          "📝 Beschreibung des Spots?"
        ) || "";


      /* Kategorie */

      const category =
        prompt(
          "🏷️ Kategorie?\n\nz.B. Park, See, Aussicht, Basketball"
        ) || "Chillspot";


      showStatus(
        "⏳ Speichere Chillspot..."
      );


      /* SUPABASE INSERT */

      const {
        error
      } = await supabaseClient
        .from("spots")
        .insert({

          name:
            name.trim(),

          description:
            description.trim(),

          category:
            category.trim(),

          latitude:
            selectedLocation.lat,

          longitude:
            selectedLocation.lng

        });


      if (error) {

        console.error(
          "Fehler beim Speichern:",
          error
        );

        showStatus(
          "❌ Fehler beim Speichern"
        );

        return;
      }


      showStatus(
        "✅ Chillspot veröffentlicht!"
      );


      selectedLocation = null;


      /* Spots neu laden */

      await loadSpots();

    });


    /* =========================================
       LIVE-STANDORT
    ========================================= */

    function findMe() {

      if (!navigator.geolocation) {

        showStatus(
          "❌ Dein Browser unterstützt Standort nicht"
        );

        return;
      }


      showStatus(
        "📍 Ermittle deinen Standort..."
      );


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;


          /* Karte zum Standort */

          map.setView(
            [lat, lng],
            16
          );


          /* Alten Marker löschen */

          if (userMarker) {

            map.removeLayer(
              userMarker
            );

          }


          if (accuracyCircle) {

            map.removeLayer(
              accuracyCircle
            );

          }


          /* Standort Marker */

          userMarker =
            L.circleMarker(
              [lat, lng],
              {
                radius: 9,
                color: "#ffffff",
                weight: 3,
                fillColor: "#4285f4",
                fillOpacity: 1
              }
            ).addTo(map);


          userMarker.bindPopup(
            "📍 Du bist hier"
          );


          /* Genauigkeitskreis */

          accuracyCircle =
            L.circle(
              [lat, lng],
              {
                radius: accuracy,
                color: "#4285f4",
                fillColor: "#4285f4",
                fillOpacity: 0.12,
                weight: 1
              }
            ).addTo(map);


          showStatus(
            "📍 Standort gefunden"
          );

        },

        function(error) {

          console.error(
            "Standort Fehler:",
            error
          );


          if (
            error.code === 1
          ) {

            showStatus(
              "❌ Standortzugriff wurde abgelehnt"
            );

          } else {

            showStatus(
              "❌ Standort konnte nicht ermittelt werden"
            );

          }

        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

    }


    /* =========================================
       BUTTONS
    ========================================= */

    document
      .getElementById("addButton")
      .addEventListener(
        "click",
        enableAddSpot
      );


    document
      .getElementById("locationButton")
      .addEventListener(
        "click",
        findMe
      );


    document
      .getElementById("liveLocationButton")
      .addEventListener(
        "click",
        findMe
      );


    /* =========================================
       SUCHE
    ========================================= */

    document
      .getElementById("search")
      .addEventListener(
        "keydown",
        async function(event) {

          if (event.key !== "Enter") {
            return;
          }


          const query =
            event.target.value
              .trim()
              .toLowerCase();


          if (!query) {
            return;
          }


          /* Erst vorhandene Spots durchsuchen */

          const {
            data,
            error
          } = await supabaseClient
            .from("spots")
            .select("*");


          if (error) {

            showStatus(
              "❌ Suche fehlgeschlagen"
            );

            return;
          }


          const result =
            (data || []).find(
              spot => {

                const name =
                  String(
                    spot.name || ""
                  ).toLowerCase();

                const category =
                  String(
                    spot.category || ""
                  ).toLowerCase();

                const description =
                  String(
                    spot.description || ""
                  ).toLowerCase();

                return (
                  name.includes(query) ||
                  category.includes(query) ||
                  description.includes(query)
                );

              }
            );


          if (result) {

            map.setView(
              [
                result.latitude,
                result.longitude
              ],
              16
            );


            /* passender Marker öffnen */

            spotMarkers.forEach(
              marker => {

                const position =
                  marker.getLatLng();

                if (
                  Math.abs(
                    position.lat -
                    Number(result.latitude)
                  ) < 0.00001 &&
                  Math.abs(
                    position.lng -
                    Number(result.longitude)
                  ) < 0.00001
                ) {

                  marker.openPopup();

                }

              }
            );


            return;
          }


          /*
            Wenn kein Spot gefunden wurde,
            versuchen wir die Stadt über
            OpenStreetMap zu finden.
          */

          try {

            const response =
              await fetch(
                "https://nominatim.openstreetmap.org/search?format=json&countrycodes=de&q=" +
                encodeURIComponent(query)
              );


            const places =
              await response.json();


            if (
              places.length > 0
            ) {

              const place =
                places[0];


              map.setView(
                [
                  Number(place.lat),
                  Number(place.lon)
                ],
                13
              );


              showStatus(
                "🔎 " + place.display_name
              );

            } else {

              showStatus(
                "❌ Nichts gefunden"
              );

            }

          } catch (error) {

            console.error(error);

            showStatus(
              "❌ Suche fehlgeschlagen"
            );

          }

        }
      );


    /* =========================================
       SUPABASE REALTIME
    ========================================= */

    supabaseClient
      .channel("spots-live")
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "spots"
        },
        function() {

          console.log(
            "Spot-Daten geändert"
          );

          loadSpots();

        }
      )
      .subscribe();


    /* =========================================
       START
    ========================================= */

    loadSpots();


    /*
      Leaflet braucht manchmal einen kleinen
      Moment, damit die Karte ihre Größe
      korrekt berechnet.
    */

    setTimeout(
      function() {
        map.invalidateSize();
      },
      500
    );


  </script>

</body>
</html>
