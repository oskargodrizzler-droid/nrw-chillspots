<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NRW Chillspots</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- Deine Styles -->
  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header class="header">

  <div class="header-top">

    <div>

      <h1>📍 NRW Chillspots</h1>

      <p>
        finde und teile geile Spots in NRW
      </p>

    </div>

  </div>


  <div class="top-buttons">

    <button
      class="primary"
      onclick="openSpotModal()"
    >
      ➕ Spot
    </button>


    <button
      class="secondary"
      onclick="openAuthModal()"
    >
      👤 Account
    </button>


    <button
  id="adminTopButton"
  class="secondary"
  onclick="openAdminDashboard()"
>
  🛡️ Admin
</button>

  </div>


  <div
    id="accountInfo"
    class="account-info"
  >
    Nicht eingeloggt
  </div>

</header>



<!-- ==================================================
     SUCHE
================================================== -->

<section class="panel">

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Stadt oder Spot suchen..."
    oninput="filterSpots()"
  >

</section>



<!-- ==================================================
     KARTE
================================================== -->

<div id="map"></div>



<!-- ==================================================
     SPOT LISTE
================================================== -->

<section class="panel">

  <div class="section-title">

    <h2>🔥 Chillspots</h2>

    <button
      class="secondary small-button"
      onclick="clearSearch()"
    >
      Zurücksetzen
    </button>

  </div>


  <div id="spotList">

    <div class="empty">
      ⏳ Spots werden geladen...
    </div>

  </div>

</section>



<!-- ==================================================
     SPOT MODAL
================================================== -->

<div
  id="spotModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>📍 Neuen Chillspot</h2>

      <button
        class="close-button"
        onclick="closeSpotModal()"
        type="button"
      >
        ✕
      </button>

    </div>


    <p class="modal-description">
      Wähle einen Standort auf der Karte und
      gib deinem Spot einen Namen.
    </p>


    <!-- NAME -->

    <label for="spotName">
      Name
    </label>

    <input
      id="spotName"
      type="text"
      placeholder="z.B. Seepark"
      maxlength="100"
    >


    <!-- BESCHREIBUNG -->

    <label for="spotDescription">
      Beschreibung
    </label>

    <textarea
      id="spotDescription"
      placeholder="Was ist an diesem Spot besonders?"
      maxlength="1000"
    ></textarea>


    <!-- KATEGORIE -->

    <label for="spotCategory">
      Kategorie
    </label>

    <select id="spotCategory">

      <option value="Park">
        🌳 Park
      </option>

      <option value="See">
        🌊 See
      </option>

      <option value="Sport">
        ⚽ Sport
      </option>

      <option value="Aussicht">
        🌄 Aussicht
      </option>

      <option value="Gaming">
        🎮 Gaming
      </option>

      <option value="Sonstiges">
        📍 Sonstiges
      </option>

    </select>


    <!-- FOTO -->

    <label for="spotPhoto">
      Foto
    </label>

    <input
      id="spotPhoto"
      type="file"
      accept="image/*"
    >


    <!-- STANDORT -->

    <div
      id="selectedLocation"
      class="selected-location"
    >
      Noch kein Standort ausgewählt
    </div>


    <button
      class="location-button"
      onclick="useMyLocation()"
      type="button"
    >
      📍 Meinen Standort verwenden
    </button>


    <!-- BUTTONS -->

    <div class="modal-actions">

      <button
        class="secondary"
        onclick="closeSpotModal()"
        type="button"
      >
        Abbrechen
      </button>


      <button
        class="primary"
        onclick="createSpot()"
        type="button"
      >
        🚀 Veröffentlichen
      </button>

    </div>

  </div>

</div>



<!-- ==================================================
     ACCOUNT MODAL
================================================== -->

<div
  id="authModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>👤 Account</h2>

      <button
        class="close-button"
        onclick="closeAuthModal()"
        type="button"
      >
        ✕
      </button>

    </div>


    <!-- LOGIN -->

    <div id="loginSection">

      <label for="email">
        E-Mail
      </label>

      <input
        id="email"
        type="email"
        placeholder="deine@email.de"
        autocomplete="email"
      >


      <label for="password">
        Passwort
      </label>

      <input
        id="password"
        type="password"
        placeholder="Mindestens 6 Zeichen"
        autocomplete="current-password"
      >


      <div class="modal-actions">

        <button
          class="primary"
          onclick="signIn()"
          type="button"
        >
          🔑 Einloggen
        </button>

        <button
          class="secondary"
          onclick="signUp()"
          type="button"
        >
          ✨ Registrieren
        </button>

      </div>

    </div>



    <!-- EINGELOGGT -->

    <div
      id="loggedInSection"
      style="display:none"
    >

      <div class="profile-preview">

        <div
          id="profileNickname"
          class="profile-nickname"
        >
          @nickname
        </div>

        <div
          id="profileEmail"
          class="profile-email"
        >
          email
        </div>

      </div>


      <button
        class="primary full-button"
        onclick="openProfile()"
        type="button"
      >
        ✏️ Profil bearbeiten
      </button>


      <button
        id="logoutButton"
        class="secondary full-button"
        onclick="logout()"
        type="button"
      >
        👋 Ausloggen
      </button>

    </div>

  </div>

</div>



<!-- ==================================================
     STATUS
================================================== -->

<div
  id="status"
  class="status"
></div>



<!-- ==================================================
     LEAFLET
================================================== -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>



<!-- ==================================================
     SUPABASE
================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>



<!-- ==================================================
     DEINE JS DATEIEN
================================================== -->

<script src="js/app.js"></script>

<script src="js/auth.js"></script>

<script src="js/profiles.js"></script>

<script src="js/spots.js"></script>

<script src="js/likes.js"></script>

<script src="js/map.js"></script>

<script src="js/admin.js"></script>


</body>

</html>
