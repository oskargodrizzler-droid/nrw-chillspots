<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NRW Chillspots 📍</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f0d;
      color: white;
      overflow: hidden;
    }

    header {
      height: 70px;
      background: #111815;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #26302b;
      position: relative;
      z-index: 1000;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
    }

    .logo span {
      color: #4ade80;
    }

    .top-buttons {
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    .location-btn,
    .add-btn {
      background: #1f2937;
      color: white;
      padding: 11px 14px;
      border-radius: 12px;
    }

    .add-btn {
      background: #22c55e;
      color: #06100a;
    }

    #map {
      position: absolute;
      top: 70px;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1;
    }

    .search-box {
      position: absolute;
      z-index: 500;
      top: 85px;
      left: 15px;
      right: 15px;
      max-width: 500px;
      margin: auto;
    }

    .search-box input {
      width: 100%;
      padding: 15px 18px;
      border-radius: 15px;
      border: 1px solid #39433e;
      background: rgba(15, 23, 19, 0.95);
      color: white;
      outline: none;
      font-size: 16px;
    }

    .location-info {
      position: absolute;
      z-index: 500;
      bottom: 25px;
      left: 15px;
      right: 15px;
      max-width: 450px;
      margin: auto;
      background: rgba(12, 18, 15, 0.95);
      border: 1px solid #344039;
      border-radius: 18px;
      padding: 15px;
      display: none;
    }

    .location-info button {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: #22c55e;
      color: #06100a;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 5000;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal-box {
      width: 100%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
      background: #111815;
      border: 1px solid #344039;
      border-radius: 22px;
      padding: 22px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #0b0f0d;
      border: 1px solid #39433e;
      border-radius: 12px;
      padding: 13px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
    }

    .cancel {
      background: #29312d;
      color: white;
    }

    .publish {
      background: #22c55e;
      color: #06100a;
    }

    .hint {
      background: #17211c;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      color: #b8c4bd;
      margin-bottom: 10px;
    }

    .spot-card {
      min-width: 230px;
    }

    .spot-image {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .spot-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .spot-category {
      color: #4ade80;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .spot-description {
      color: #c7cec9;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .like-btn {
      background: #202923;
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
    }

    .like-btn.liked {
      background: #ef4444;
    }

    .status {
      position: fixed;
      top: 80px;
      right: 15px;
      z-index: 6000;
      background: #111815;
      border: 1px solid #344039;
      padding: 12px 15px;
      border-radius: 12px;
      display: none;
      max-width: 300px;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 10px;
      }

      .logo {
        font-size: 18px;
      }

      .location-btn,
      .add-btn {
        padding: 9px 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">📍 NRW <span>Chillspots</span></div>

  <div class="top-buttons">
    <button class="location-btn" onclick="findMe()">
      📍 Mein Standort
    </button>

    <button class="add-btn" onclick="openModal()">
      ➕ Spot
    </button>
  </div>
</header>

<div class="search-box">
  <input
    id="search"
    type="text"
    placeholder="🔎 Stadt oder Spot suchen..."
    oninput="searchSpots()"
  >
</div>

<div id="map"></div>

<div id="status" class="status"></div>

<div id="locationInfo" class="location-info">
  <b>📍 Standort gefunden</b>
  <div id="locationText"></div>

  <button onclick="addCurrentLocation()">
    ➕ Hier Chillspot hinzufügen
  </button>
</div>

<!-- ADD SPOT MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <h2>📍 Neuen Chillspot</h2>

    <div class="hint">
      Klicke zuerst auf der Karte auf den gewünschten Standort.
    </div>

    <div id="selectedLocation">
      Noch kein Standort ausgewählt
    </div>

    <label>Name</label>
    <input
      id="spotName"
      type="text"
      placeholder="z.B. Stadtpark"
    >

    <label>Beschreibung</label>
    <textarea
      id="spotDescription"
      placeholder="Warum ist der Spot nice?"
    ></textarea>

    <label>Kategorie</label>

    <select id="spotCategory">
      <option value="🌳 Natur">🌳 Natur</option>
      <option value="🏞️ Park">🏞️ Park</option>
      <option value="🌊 Wasser">🌊 Wasser</option>
      <option value="🏀 Sport">🏀 Sport</option>
      <option value="🌆 Aussicht">🌆 Aussicht</option>
      <option value="☕ Essen & Trinken">☕ Essen & Trinken</option>
      <option value="🎮 Freizeit">🎮 Freizeit</option>
      <option value="🔥 Sonstiges">🔥 Sonstiges</option>
    </select>

    <label>📸 Foto</label>
    <input
      id="spotPhoto"
      type="file"
      accept="image/*"
    >

    <div class="modal-buttons">

      <button class="cancel" onclick="closeModal()">
        Abbrechen
      </button>

      <button class="publish" onclick="publishSpot()">
        🚀 Veröffentlichen
      </button>

    </div>

  </div>
</div>


<!-- Supabase -->
<script src="https://ayukjqhmmgqbgtiusvsx.supabase.co"></script>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

  /* =====================================================
     SUPABASE
     ===================================================== */

  const SUPABASE_URL = "HIER_DEINE_SUPABASE_PROJECT_URL_EINSETZEN";

  const SUPABASE_KEY =
    "sb_publishable_oN4MVoqoeGLRPtEEgIpalQ_H_GZk1u0";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================================
     MAP
     ===================================================== */

  const map = L.map("map").setView(
    [51.4332, 7.1000],
    9
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }
  ).addTo(map);


  let selectedLocation = null;
  let currentLocation = null;
  let markers = [];
  let allSpots = [];


  /* =====================================================
     MAP CLICK
     ===================================================== */

  map.on("click", function(e) {

    selectedLocation = {
      lat: e.latlng.lat,
      lng: e.latlng.lng
    };

    document.getElementById("selectedLocation").innerHTML =
      `📍 ${e.latlng.lat.toFixed(5)},
      ${e.latlng.lng.toFixed(5)}`;

    openModal();

  });


  /* =====================================================
     LOAD SPOTS
     ===================================================== */

  async function loadSpots() {

    showStatus("⏳ Lade Chillspots...");

    const { data, error } =
      await supabaseClient
        .from("spots")
        .select("*")
        .order("id", {
          ascending: false
        });

    if (error) {

      console.error(error);

      showStatus(
        "❌ Spots konnten nicht geladen werden"
      );

      return;
    }

    allSpots = data || [];

    renderSpots(allSpots);

    showStatus(
      `✅ ${allSpots.length} Chillspots geladen`
    );
  }


  /* =====================================================
     RENDER SPOTS
     ===================================================== */

  function renderSpots(spots) {

    markers.forEach(marker => {
      map.removeLayer(marker);
    });

    markers = [];


    spots.forEach(spot => {

      const lat =
        spot.latitude ??
        spot.lat;

      const lng =
        spot.longitude ??
        spot.lng;

      if (
        lat === null ||
        lat === undefined ||
        lng === null ||
        lng === undefined
      ) {
        return;
      }


      let imageHTML = "";

      const imageUrl =
        spot.image_url ||
        spot.photo_url ||
        spot.image;


      if (imageUrl) {

        imageHTML = `
          <img
            class="spot-image"
            src="${escapeHTML(imageUrl)}"
          >
        `;
      }


      const likes =
        spot.likes ||
        0;


      const popup = `

        <div class="spot-card">

          ${imageHTML}

          <div class="spot-name">
            📍 ${escapeHTML(spot.name || "Chillspot")}
          </div>

          <div class="spot-category">
            ${escapeHTML(spot.category || "🔥 Chillspot")}
          </div>

          <div class="spot-description">
            ${escapeHTML(
              spot.description ||
              "Kein Beschreibungstext"
            )}
          </div>

          <button
            class="like-btn"
            onclick="likeSpot('${spot.id}', this)"
          >
            ❤️ ${likes}
          </button>

        </div>
      `;


      const marker =
        L.marker([lat, lng])
          .addTo(map)
          .bindPopup(popup);


      markers.push(marker);

    });

  }


  /* =====================================================
     SEARCH
     ===================================================== */

  function searchSpots() {

    const query =
      document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    if (!query) {

      renderSpots(allSpots);

      return;
    }


    const filtered =
      allSpots.filter(spot => {

        const text = `

          ${spot.name || ""}

          ${spot.description || ""}

          ${spot.category || ""}

        `.toLowerCase();


        return text.includes(query);

      });


    renderSpots(filtered);


    if (filtered.length === 0) {

      showStatus(
        "🔎 Keine Chillspots gefunden"
      );

    } else {

      showStatus(
        `🔎 ${filtered.length} Spot(s) gefunden`
      );

    }

  }


  /* =====================================================
     ADD SPOT
     ===================================================== */

  function openModal() {

    document.getElementById("modal").style.display =
      "flex";

  }


  function closeModal() {

    document.getElementById("modal").style.display =
      "none";

  }


  /* =====================================================
     CURRENT LOCATION
     ===================================================== */

  function findMe() {

    if (!navigator.geolocation) {

      showStatus(
        "❌ Dein Browser unterstützt Standort nicht."
      );

      return;
    }


    showStatus(
      "📍 Standort wird gesucht..."
    );


    navigator.geolocation.getCurrentPosition(

      function(position) {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        currentLocation = {
          lat,
          lng
        };


        map.setView(
          [lat, lng],
          15
        );


        L.circleMarker(
          [lat, lng],
          {
            radius: 9,
            color: "#22c55e",
            fillColor: "#22c55e",
            fillOpacity: 1
          }
        )
        .addTo(map)
        .bindPopup(
          "📍 Du bist hier"
        )
        .openPopup();


        document.getElementById(
          "locationInfo"
        ).style.display = "block";


        document.getElementById(
          "locationText"
        ).innerText =
          `${lat.toFixed(5)}, ${lng.toFixed(5)}`;


        showStatus(
          "✅ Standort gefunden"
        );

      },

      function(error) {

        console.error(error);

        showStatus(
          "❌ Standort konnte nicht ermittelt werden. Erlaube deinem Browser den Standortzugriff."
        );

      },

      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }

    );

  }


  /* =====================================================
     ADD CURRENT LOCATION
     ===================================================== */

  function addCurrentLocation() {

    if (!currentLocation) {

      showStatus(
        "❌ Erst deinen Standort suchen."
      );

      return;
    }


    selectedLocation =
      currentLocation;


    document.getElementById(
      "selectedLocation"
    ).innerHTML =
      `📍 ${currentLocation.lat.toFixed(5)},
      ${currentLocation.lng.toFixed(5)}`;


    openModal();

  }


  /* =====================================================
     PUBLISH
     ===================================================== */

  async function publishSpot() {

    if (!selectedLocation) {

      showStatus(
        "📍 Bitte zuerst einen Punkt auf der Karte auswählen."
      );

      return;
    }


    const name =
      document
        .getElementById("spotName")
        .value
        .trim();


    const description =
      document
        .getElementById("spotDescription")
        .value
        .trim();


    const category =
      document
        .getElementById("spotCategory")
        .value;


    const photo =
      document
        .getElementById("spotPhoto")
        .files[0];


    if (!name) {

      showStatus(
        "❌ Gib dem Spot einen Namen."
      );

      return;
    }


    showStatus(
      "⏳ Spot wird veröffentlicht..."
    );


    let imageUrl = null;


    /* =================================================
       PHOTO UPLOAD
       ================================================= */

    if (photo) {

      const fileName =
        `${Date.now()}-${Math.random()
          .toString(36)
          .substring(2)}-${photo.name}`;


      const { error: uploadError } =
        await supabaseClient
          .storage
          .from("spot-photos")
          .upload(
            fileName,
            photo,
            {
              cacheControl: "3600",
              upsert: false
            }
          );


      if (uploadError) {

        console.error(uploadError);

        showStatus(
          "❌ Foto konnte nicht hochgeladen werden."
        );

        return;
      }


      const { data: publicData } =
        supabaseClient
          .storage
          .from("spot-photos")
          .getPublicUrl(fileName);


      imageUrl =
        publicData.publicUrl;

    }


    /* =================================================
       DATABASE INSERT
       ================================================= */

    const insertData = {

      name: name,

      description:
        description || null,

      category:
        category,

      latitude:
        selectedLocation.lat,

      longitude:
        selectedLocation.lng

    };


    /*
      Falls deine spots-Tabelle eine
      image_url-Spalte besitzt, Foto speichern.
    */

    if (imageUrl) {

      insertData.image_url =
        imageUrl;

    }


    const { error } =
      await supabaseClient
        .from("spots")
        .insert(insertData);


    if (error) {

      console.error(error);

      showStatus(
        "❌ Fehler beim Speichern des Spots."
      );

      return;
    }


    /* RESET */

    document.getElementById(
      "spotName"
    ).value = "";


    document.getElementById(
      "spotDescription"
    ).value = "";


    document.getElementById(
      "spotPhoto"
    ).value = "";


    selectedLocation = null;


    closeModal();


    showStatus(
      "🎉 Spot veröffentlicht!"
    );


    await loadSpots();

  }


  /* =====================================================
     LIKE SYSTEM
     ===================================================== */

  async function likeSpot(
    spotId,
    button
  ) {

    const alreadyLiked =
      localStorage.getItem(
        "liked_" + spotId
      );


    if (alreadyLiked) {

      showStatus(
        "❤️ Diesen Spot hast du bereits geliked."
      );

      return;
    }


    const { error } =
      await supabaseClient
        .from("likes")
        .insert({

          spot_id:
            spotId

        });


    if (error) {

      console.error(error);

      showStatus(
        "❌ Like konnte nicht gespeichert werden."
      );

      return;
    }


    localStorage.setItem(
      "liked_" + spotId,
      "true"
    );


    showStatus(
      "❤️ Geliked!"
    );


    await updateLikeCount(
      spotId,
      button
    );

  }


  async function updateLikeCount(
    spotId,
    button
  ) {

    const { count, error } =
      await supabaseClient
        .from("likes")
        .select("*", {
          count: "exact",
          head: true
        })
        .eq(
          "spot_id",
          spotId
        );


    if (error) {

      console.error(error);

      return;
    }


    button.innerText =
      `❤️ ${count || 0}`;

  }


  /* =====================================================
     STATUS
     ===================================================== */

  let statusTimeout;


  function showStatus(message) {

    const status =
      document.getElementById(
        "status"
      );


    status.innerText =
      message;


    status.style.display =
      "block";


    clearTimeout(
      statusTimeout
    );


    statusTimeout =
      setTimeout(() => {

        status.style.display =
          "none";

      }, 3500);

  }


  /* =====================================================
     HTML SECURITY
     ===================================================== */

  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =====================================================
     START
     ===================================================== */

  loadSpots();

</script>

</body>
</html>
