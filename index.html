<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NRW Chillspots</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

</head>

<body>

<header>

  <div class="logo">
    📍 NRW Chillspots
  </div>

  <div class="header-buttons">

    <button
      id="accountButton"
      class="secondary"
      onclick="openAuthModal()"
    >
      👤 Account
    </button>

    <button
      id="profileButton"
      class="secondary"
      onclick="openProfile()"
      style="display:none;"
    >
      ⚙️ Profil
    </button>

    <button
      id="adminTopButton"
      class="secondary"
      onclick="window.location.href='pages/admin.html'"
      style="display:none;"
    >
      🛡️ Admin
    </button>

    <button
      id="addSpotButton"
      class="primary"
      onclick="openSpotModal()"
    >
      + Spot
    </button>

  </div>

</header>


<main>

  <section class="hero">

    <h1>deine Chillspots in NRW 🌆</h1>

    <p>
      Finde neue Orte, teile deine Lieblingsspots
      und entdecke NRW.
    </p>

  </section>


  <section class="map-section">

    <div id="map"></div>

  </section>


  <section class="spots-section">

    <div class="section-title">

      <h2>📍 Spots</h2>

      <button
        class="secondary"
        onclick="loadSpots()"
      >
        🔄 Aktualisieren
      </button>

    </div>


    <div
      id="spotList"
      class="spot-list"
    >

      <div class="empty">
        ⏳ Spots werden geladen...
      </div>

    </div>

  </section>

</main>


<!-- ========================= -->
<!-- AUTH MODAL -->
<!-- ========================= -->

<div
  id="authModal"
  class="modal"
  style="display:none;"
>

  <div class="modal-box">

    <button
      class="modal-close"
      onclick="closeAuthModal()"
    >
      ✕
    </button>

    <h2 id="authTitle">
      👤 Account
    </h2>


    <input
      id="authEmail"
      type="email"
      placeholder="E-Mail"
      autocomplete="email"
    >


    <input
      id="authPassword"
      type="password"
      placeholder="Passwort"
      autocomplete="current-password"
    >


    <button
      class="primary full-button"
      onclick="loginUser()"
    >
      🔑 Einloggen
    </button>


    <button
      class="secondary full-button"
      onclick="registerUser()"
    >
      📝 Registrieren
    </button>


    <button
      id="logoutButton"
      class="delete-btn full-button"
      onclick="logoutUser()"
      style="display:none;"
    >
      🚪 Ausloggen
    </button>

  </div>

</div>


<!-- ========================= -->
<!-- SPOT MODAL -->
<!-- ========================= -->

<div
  id="spotModal"
  class="modal"
  style="display:none;"
>

  <div class="modal-box">

    <button
      class="modal-close"
      onclick="closeSpotModal()"
    >
      ✕
    </button>


    <h2>📍 Neuen Spot erstellen</h2>


    <input
      id="spotName"
      type="text"
      maxlength="80"
      placeholder="Name des Spots"
    >


    <textarea
      id="spotDescription"
      maxlength="500"
      placeholder="Beschreibung"
    ></textarea>


    <select id="spotCategory">

      <option value="Chillen">
        🌳 Chillen
      </option>

      <option value="Sport">
        ⚽ Sport
      </option>

      <option value="Gaming">
        🎮 Gaming
      </option>

      <option value="Natur">
        🌲 Natur
      </option>

      <option value="Skaten">
        🛹 Skaten
      </option>

      <option value="Sonstiges">
        📍 Sonstiges
      </option>

    </select>


    <button
      class="secondary full-button"
      onclick="useMyLocation()"
    >
      📍 Meinen Standort verwenden
    </button>


    <p
      id="selectedLocation"
      class="selected-location"
    >
      Noch kein Standort ausgewählt
    </p>


    <p class="hint">
      Oder klicke direkt auf die Karte,
      um einen Standort auszuwählen.
    </p>


    <input
      id="spotPhoto"
      type="file"
      accept="image/jpeg,image/png,image/webp,image/gif"
    >


    <button
      class="primary full-button"
      onclick="createSpot()"
    >
      🚀 Spot veröffentlichen
    </button>

  </div>

</div>


<div
  id="status"
  class="status"
></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/profiles.js"></script>
<script src="js/likes.js"></script>
<script src="js/spots.js"></script>
<script src="js/map.js"></script>
<script src="js/admin.js"></script>

</body>

</html>
